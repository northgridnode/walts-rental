<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Application Received</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .check { font-size: 3rem; margin-bottom: 16px; }
    h1 { font-size: 1.4rem; color: #1a1a2e; margin-bottom: 10px; }
    p { font-size: 0.95rem; color: #555; line-height: 1.6; }
    .address { margin-top: 20px; font-size: 0.85rem; color: #888; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✅</div>
    <h1>Application Received</h1>
    <p>Thank you for applying. Your application has been submitted and the landlord will be in touch shortly.</p>
    <p class="address">823 S Walts Ave · Sioux Falls, SD 57103</p>
  </div>
</body>
</html>
