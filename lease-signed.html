<!DOCTYPE html>
<html lang="en">
<head>

    p { font-size: 0.95rem; color: #555; line-height: 1.6; margin-bottom: 8px; }
    .address { font-weight: 600; color: #1a1a2e; margin-top: 16px; font-size: 0.9rem; }

<body>
  <div class="card">
    <div class="check">✅</div>
    <h1>Lease Signed</h1>
    <p>Your lease has been submitted and the landlord has been notified.</p>
